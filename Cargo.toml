[package]
name = "google-mcp"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/matpb/google-mcp-rs"
homepage = "https://github.com/matpb/google-mcp-rs"
readme = "README.md"
keywords = ["mcp", "gmail", "google", "workspace", "oauth"]
categories = ["web-programming", "command-line-utilities"]
license = "MIT"
authors = ["Mathieu-Philippe Bourgeois"]
description = "Multi-tenant Rust MCP server for Google Workspace: Gmail, Sheets, Drive, Docs, Calendar, Tasks, Contacts and Search Console, over streamable HTTP (multi-tenant OAuth 2.1) or stdio"

[[bin]]
name = "google-mcp"
path = "src/main.rs"

[dependencies]
# Web framework
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }
http = "1"
tokio = { version = "1.42", features = ["full"] }

# MCP
rmcp = { version = "3.4", features = ["server", "transport-streamable-http-server"] }
schemars = "1.2"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# OAuth + crypto
hmac = "0.13"
sha2 = "0.11"
base64ct = { version = "1.6", features = ["alloc"] }
base64 = "0.23"
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.4"

# Storage
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "~2.5"

# MIME
mail-builder = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"

# Utilities
uuid = { version = "1.11", features = ["v4"] }
time = { version = "0.3", features = ["serde", "macros", "formatting"] }
url = "2.5"
percent-encoding = "2"
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
map_unwrap_or = "warn"
manual_let_else = "warn"
uninlined_format_args = "warn"
doc_markdown = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
needless_raw_string_hashes = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
redundant_else = "warn"
unnecessary_wraps = "warn"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
